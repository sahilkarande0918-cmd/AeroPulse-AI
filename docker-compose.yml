# Hosted database (Neon or any PostgreSQL): set DATABASE_URL in .env, then
#     docker compose up -d --build
# Local PostgreSQL (offline / on-premise / live demos: no network latency), ignores DATABASE_URL:
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Required in .env: JWT_SECRET_KEY, DEMO_PASSWORD (and POSTGRES_PASSWORD for the local database).
name: aeropulse

services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env, or use docker-compose.local.yml}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      APP_ENV: ${APP_ENV_DOCKER:-production}
      CORS_ORIGINS: ${CORS_ORIGINS_DOCKER:-http://localhost:8080}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-false}
    restart: unless-stopped

  frontend:
    build: { context: ./frontend }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
